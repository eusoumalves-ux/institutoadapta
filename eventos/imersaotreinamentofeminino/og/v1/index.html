<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<title>OG cover v1</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #1a1a1a; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }

  .cover {
    width: 1200px;
    height: 630px;
    position: relative;
    overflow: hidden;
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    background: linear-gradient(135deg, #003a8d 0%, #0054ca 60%, #116bf8 100%);
    display: flex;
  }
  .cover::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 88% 25%, rgba(125,255,70,0.12) 0%, transparent 45%),
      radial-gradient(circle at 12% 80%, rgba(255,255,255,0.08) 0%, transparent 45%);
    z-index: 1;
  }

  .left {
    flex: 1.45;
    position: relative;
    z-index: 2;
    padding: 56px 0 56px 64px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .right {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  .right::before {
    content: '';
    position: absolute;
    inset: 0 auto 0 0;
    width: 70%;
    background: linear-gradient(to right, rgba(0,84,202,1) 0%, rgba(0,84,202,0.0) 80%);
    z-index: 2;
  }
  .right img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 30% top;
  }

  .brand-row {
    color: rgba(255,255,255,0.95);
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.32em;
    text-transform: uppercase;
  }

  .title-block {
    margin-top: 20px;
  }
  .imersao-title {
    color: #7dff46;
    font-size: 88px;
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: -0.04em;
    text-transform: uppercase;
  }
  .em-line {
    color: rgba(255,255,255,0.75);
    font-size: 24px;
    font-weight: 500;
    margin-top: 14px;
    margin-bottom: 6px;
  }
  .topic {
    color: #fff;
    font-size: 56px;
    font-weight: 700;
    line-height: 1.0;
    letter-spacing: -0.025em;
  }
  .subtopic {
    color: rgba(255,255,255,0.92);
    font-size: 32px;
    font-weight: 500;
    line-height: 1.15;
    margin-top: 8px;
    letter-spacing: -0.01em;
  }

  .meta {
    margin-top: 28px;
  }
  .meta-line {
    color: rgba(255,255,255,0.92);
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.01em;
    line-height: 1.5;
  }
  .meta-line + .meta-line {
    color: rgba(255,255,255,0.7);
    font-size: 15px;
    font-weight: 600;
    margin-top: 4px;
  }

  .price-tag {
    position: absolute;
    bottom: 28px;
    right: 28px;
    z-index: 4;
    background: #7dff46;
    color: #062100;
    border-radius: 999px;
    padding: 12px 22px;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 0.02em;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  .name-tag {
    position: absolute;
    bottom: 28px;
    left: 64px;
    z-index: 4;
    color: #fff;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.78;
  }
</style>
</head>
<body>
<div class="cover">
  <div class="left">
    <div>
      <div class="brand-row">Instituto Adapta</div>
      <div class="title-block">
        <div class="imersao-title">Imersão</div>
        <div class="em-line">em</div>
        <div class="topic">Treinamento Feminino</div>
        <div class="subtopic">Da Menarca à Menopausa</div>
      </div>
      <div class="meta">
        <div class="meta-line">3h ao vivo · Online · Q&amp;A com a especialista</div>
        <div class="meta-line">Método PHF · Periodização Hormonal Feminina · MEC via Faculdade Focus</div>
      </div>
    </div>
    <div class="name-tag">Com Dra. Bianca Ramallo</div>
  </div>
  <div class="right">
    <img src="/imersaotreinamentofeminino/images/palestrantes/bianca-ramallo.png" alt="Dra. Bianca Ramallo"/>
  </div>
  <div class="price-tag">R$ 27 · 200 vagas</div>
</div>
</body>
</html>
