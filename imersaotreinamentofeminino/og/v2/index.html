<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<title>OG cover v2</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,800;9..144,900&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #1a1a1a; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }

  .cover {
    width: 1200px;
    height: 630px;
    position: relative;
    overflow: hidden;
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    background: linear-gradient(135deg, #fef3e7 0%, #fde9d4 50%, #fed7aa 100%);
    display: flex;
  }
  .cover::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 88% 25%, rgba(154,52,18,0.10) 0%, transparent 45%),
      radial-gradient(circle at 12% 80%, rgba(234,88,12,0.08) 0%, transparent 45%);
    z-index: 1;
  }

  .left {
    flex: 1.45;
    position: relative;
    z-index: 2;
    padding: 56px 0 56px 64px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .right {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  .right::before {
    content: '';
    position: absolute;
    inset: 0 auto 0 0;
    width: 70%;
    background: linear-gradient(to right, rgba(254,243,231,1) 0%, rgba(254,243,231,0.0) 80%);
    z-index: 2;
  }
  .right img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 30% top;
    filter: saturate(0.95) contrast(1.02);
  }

  .brand-row {
    color: #9a3412;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.32em;
    text-transform: uppercase;
  }

  .title-block {
    margin-top: 20px;
  }
  .imersao-title {
    color: #ea580c;
    font-family: 'Fraunces', Georgia, serif;
    font-size: 96px;
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: -0.045em;
    font-style: italic;
  }
  .em-line {
    color: rgba(28,25,23,0.6);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 22px;
    font-weight: 500;
    margin-top: 12px;
    margin-bottom: 6px;
  }
  .topic {
    color: #1c1917;
    font-family: 'Fraunces', Georgia, serif;
    font-size: 50px;
    font-weight: 700;
    line-height: 1.0;
    letter-spacing: -0.025em;
  }
  .subtopic {
    color: #44403c;
    font-family: 'Fraunces', Georgia, serif;
    font-size: 32px;
    font-style: italic;
    font-weight: 500;
    line-height: 1.15;
    margin-top: 6px;
    letter-spacing: -0.01em;
  }

  .meta {
    margin-top: 28px;
  }
  .meta-line {
    color: #44403c;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.01em;
    line-height: 1.5;
  }
  .meta-line + .meta-line {
    color: #78716c;
    font-size: 15px;
    font-weight: 600;
    margin-top: 4px;
  }

  .price-tag {
    position: absolute;
    bottom: 28px;
    right: 28px;
    z-index: 4;
    background: #9a3412;
    color: #fef3e7;
    border-radius: 999px;
    padding: 12px 22px;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 0.02em;
    box-shadow: 0 8px 24px rgba(154,52,18,0.35);
  }
  .name-tag {
    position: absolute;
    bottom: 28px;
    left: 64px;
    z-index: 4;
    color: #9a3412;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.85;
  }
</style>
</head>
<body>
<div class="cover">
  <div class="left">
    <div>
      <div class="brand-row">Instituto Adapta</div>
      <div class="title-block">
        <div class="imersao-title">Imersão</div>
        <div class="em-line">para profissionais que atendem</div>
        <div class="topic">a aluna 35+</div>
        <div class="subtopic">"que procura quem entende dela."</div>
      </div>
      <div class="meta">
        <div class="meta-line">3h ao vivo · Método PHF · com Dra. Bianca Ramallo</div>
        <div class="meta-line">Periodização Hormonal Feminina · UNIFESP · MEC</div>
      </div>
    </div>
    <div class="name-tag">Vire a referência local · 200 vagas</div>
  </div>
  <div class="right">
    <img src="/imersaotreinamentofeminino/images/palestrantes/bianca-ramallo.png" alt="Dra. Bianca Ramallo"/>
  </div>
  <div class="price-tag">R$ 27</div>
</div>
</body>
</html>
